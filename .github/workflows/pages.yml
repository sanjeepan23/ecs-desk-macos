name: Pages

on:
  push:
    branches: [main]
    paths: [docs/**, src/**, index.html, package.json, pnpm-lock.yaml, vite.config.ts, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The demo is the web UI with the mock backend. A relative base lets it run under /demo/.
      - run: pnpm exec vite build --base=./ --outDir _site/demo --emptyOutDir
      - run: |
          cp -R docs/index.html docs/ui-mock.html docs/screenshots _site/
          cp src-tauri/icons/128x128.png _site/icon.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
